name: Installer startup diagnostic
on:
  push:
    branches: [fix/bundle-ui-runtime]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v8
        with:
          name: windows-installer-distributions
          run-id: 41633925743
          github-token: ${{ github.token }}
          path: dist
      - run: ./installer/test-install.ps1 -WithoutSharedRuntime
