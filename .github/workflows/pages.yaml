name: Website

on:
  push:
    branches: [main]
    paths: ["site/**", "tests/site/**", ".github/workflows/pages.yaml"]
  pull_request:
    paths: ["site/**", "tests/site/**", ".github/workflows/pages.yaml"]
  release:
    types: [published]
  workflow_run:
    workflows: ["Native build and publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests/site -v
      - name: Build links from the latest stable release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,url,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python site/build.py "$RUNNER_TEMP/release.json"
      - uses: actions/upload-pages-artifact@v4
        with: {path: _site}

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - id: deployment
        uses: actions/deploy-pages@v4
