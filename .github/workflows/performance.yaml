name: Transport performance investigation

on:
  push:
    branches: [investigate/transport-performance, investigate/transport-windows]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - name: Protocol regressions and prototype safety
        run: python -m unittest discover -s tests -v
      - name: Integrity-checked benchmark smoke test
        run: >-
          python -m benchmarks.transport --kib 64 --repeats 1 --delays 0,20
          --transports websocket --workloads ssh-upload,ssh-download,llm-paced
          --output benchmarks/results/ci.json
      - name: Window and frame integrity smoke test
        run: >-
          python -m benchmarks.windows --kib 32 --repeats 1 --rtts 0,20
          --profiles current,windows32-chunk16k
          --output benchmarks/results/window-ci.json
      - uses: actions/upload-artifact@v7
        with:
          name: transport-results-python-${{ matrix.python }}
          path: benchmarks/results/*ci.json
          if-no-files-found: error
