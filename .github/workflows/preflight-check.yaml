name: Bootstrap preflight checks

on:
  push:
    branches: [fix/bootstrap-preflight, feature/hook-save-password, fix/hook-update-approval, feature/ascii-json-framing, feature/python-binary-protocol, feature/websocket-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run integration and protocol tests
        run: python -m unittest discover -s tests -v
      - name: Benchmark integrity and delayed-ACK smoke test
        run: >-
          python -m benchmarks.transport --kib 64 --repeats 1 --delays 0,20
          --workloads ssh-upload,ssh-download,llm-paced
          --output benchmarks/results/release-smoke.json

      - name: Flow integrity and RTT smoke test
        run: >-
          python -m benchmarks.flow --kib 32 --repeats 1 --rtts 0,20
          --workloads ssh-upload,ssh-download,llm-paced
          --output benchmarks/results/flow-ci.json

  credentials-windows:
    name: Windows Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Configure uv tool directories
        run: |
          Add-Content $env:GITHUB_ENV "UV_TOOL_DIR=$env:RUNNER_TEMP/guac-tools"
          Add-Content $env:GITHUB_ENV "UV_TOOL_BIN_DIR=$env:RUNNER_TEMP/guac-bin"
      - name: Install package with uv tool
        run: |
          python -m pip install uv
          uv tool install . --python "$env:pythonLocation/python.exe"
      - name: Test Windows background startup
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_background.py -v
      - name: Test Windows input pipeline and version checks
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_input_pipeline.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_version_checks.py -v
      - name: Test Windows flow limits
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_flow.py -v
      - name: Test Windows update command validation
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_server_update.py -v
      - name: Test Windows interactive update consent
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_update_prompt.py -v
      - name: Test Windows hook credential setup
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_hook_auth.py -v
      - name: Test Windows startup update approval
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_startup_prompt.py -v
      - name: Test Windows binary framing
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_framing.py -v
      - name: Test Windows hook console output
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_console.py -v
      - name: Test Windows listener errors
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_listeners.py -v
      - name: Test authentication and native Windows credential storage
        env:
          GUAC_TEST_NATIVE_KEYRING: "1"
        run: |
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m unittest discover -s tests -p test_auth.py -v

