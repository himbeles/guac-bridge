name: Native build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GUAC_BRIDGE_REQUIRE_WINDOWS_AGENT: "1"

permissions:
  contents: read

jobs:
  agent:
    name: Static Linux x86-64 helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-unknown-linux-musl}
      - name: Build static helper without client dependencies
        run: cargo xtask helper linux
      - name: Check standalone executable
        run: |
          target/x86_64-unknown-linux-musl/release/guac-bridge-agent --version
          file target/x86_64-unknown-linux-musl/release/guac-bridge-agent | grep -E 'static.*linked'
          mkdir -p agent
          cp target/x86_64-unknown-linux-musl/release/guac-bridge-agent agent/guac-bridge-agent-linux-x86_64
          sha256sum agent/* > agent/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with: {name: linux-agent, path: agent/, if-no-files-found: error}

  windows-agent:
    name: Standalone Windows x86-64 helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build helper with static CRT
        shell: pwsh
        run: |
          cargo xtask helper windows
          New-Item -ItemType Directory -Force agent
          Copy-Item target/release/guac-bridge-agent.exe agent/guac-bridge-agent-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with: {name: windows-agent, path: agent/, if-no-files-found: error}

  test-linux:
    name: Native Linux integration
    needs: [agent, windows-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: actions/download-artifact@v8
        with: {name: linux-agent, path: crates/guac-bridge/assets}
      - uses: actions/download-artifact@v8
        with: {name: windows-agent, path: crates/guac-bridge/assets}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install aiohttp
      - run: cargo xtask check --prepared
      - run: cargo xtask integration --prepared --suite native
      - run: python scripts/benchmark.py --mib 2 --repeats 1 --output benchmark-smoke.json
      - name: Validate Cargo source package includes its helper
        run: |
          cargo package  -p guac-bridge --allow-dirty --no-verify
          tar -tzf target/package/guac-bridge-*.crate | grep assets/guac-bridge-agent-linux-x86_64
          tar -tzf target/package/guac-bridge-*.crate | grep assets/guac-bridge-agent-windows-x86_64.exe
      - uses: actions/upload-artifact@v7
        with: {name: benchmark-smoke, path: benchmark-smoke.json}

  cargo-windows:
    name: Cargo-only Windows source install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {key: source-bootstrap}
      - name: Build source checkout without a prepared helper
        run: cargo check  -p guac-bridge --bin guac-bridge

  windows:
    name: Windows x86-64 executable, installer and uv package
    needs: [agent, windows-agent]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with: {name: linux-agent, path: crates/guac-bridge/assets}
      - uses: actions/download-artifact@v8
        with: {name: windows-agent, path: crates/guac-bridge/assets}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install maturin uv aiohttp
      - name: Check workspace and native credential store
        env: {GUAC_TEST_NATIVE_KEYRING: "1"}
        run: cargo xtask check --prepared
      - run: cargo xtask integration --prepared --suite native
      - name: Install shared UI runtime for Windows tests
        run: ./scripts/install-ui-runtime.ps1
      - run: python tests/windows/probe.py
      - run: python -m unittest discover -s tests/windows -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: "manager-preview-${{ runner.os }}-${{ matrix.os || 'publish' }}", path: manager-preview.png, if-no-files-found: ignore}
      - name: Test Windows server from cmd shell
        env: {GUAC_TEST_SHELL: cmd.exe}
        run: python -m unittest discover -s tests/windows -p test_bootstrap.py -v
      - run: cargo xtask python --prepared
      - name: Install and test the uv CLI
        shell: pwsh
        run: |
          $env:UV_TOOL_DIR = "$env:RUNNER_TEMP/guac-tools"
          $env:UV_TOOL_BIN_DIR = "$env:RUNNER_TEMP/guac-bin"
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv tool install --from $wheel guac-bridge
          & "$env:UV_TOOL_BIN_DIR/guac-bridge.exe" --version
          & "$env:UV_TOOL_BIN_DIR/guac-bridge.exe" ssh --help
          & "$env:UV_TOOL_BIN_DIR/guac-bridge.exe" llm --help
          foreach ($legacy in @('guac-ssh-client.exe', 'guac-llm-client.exe')) {
            if (Test-Path "$env:UV_TOOL_BIN_DIR/$legacy") { throw "Unexpected CLI alias: $legacy" }
          }
          & "$env:UV_TOOL_DIR/guac-bridge/Scripts/python.exe" -m guac_bridge --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo xtask portable --wheel $wheel
      - uses: actions/upload-artifact@v7
        with: {name: windows-distributions, path: dist/, if-no-files-found: error}

  bundled-installer:
    name: Windows installer with private WinUI runtime
    needs: [agent, windows-agent]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {key: bundled-installer}
      - uses: actions/download-artifact@v8
        with: {name: linux-agent, path: crates/guac-bridge/assets}
      - uses: actions/download-artifact@v8
        with: {name: windows-agent, path: crates/guac-bridge/assets}
      - name: Build Windows installer and measure its size
        shell: pwsh
        run: cargo xtask installer --prepared
      - name: Test installed private runtime without a shared framework
        shell: pwsh
        run: ./installer/test-install.ps1 -WithoutSharedRuntime
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: windows-installer-distributions, path: dist/, if-no-files-found: error}

  linux-distribution:
    name: Linux x86-64 portable and Python packages
    needs: [agent, windows-agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v8
        with: {name: linux-agent, path: crates/guac-bridge/assets}
      - uses: actions/download-artifact@v8
        with: {name: windows-agent, path: crates/guac-bridge/assets}
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: "2_28"
          args: --release  --out dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install maturin uv
      - run: cargo xtask python --prepared --sdist
      - name: Test uv package and optional Python module
        run: |
          export UV_TOOL_DIR="$RUNNER_TEMP/guac-tools"
          export UV_TOOL_BIN_DIR="$RUNNER_TEMP/guac-bin"
          uv tool install --from dist/*.whl guac-bridge
          "$UV_TOOL_BIN_DIR/guac-bridge" --version
          "$UV_TOOL_BIN_DIR/guac-bridge" ssh --help
          "$UV_TOOL_BIN_DIR/guac-bridge" llm --help
          test ! -e "$UV_TOOL_BIN_DIR/guac-ssh-client"
          test ! -e "$UV_TOOL_BIN_DIR/guac-llm-client"
          "$UV_TOOL_DIR/guac-bridge/bin/python" -m guac_bridge --version
          cargo xtask portable --wheel dist/*.whl
      - name: Check source distribution contains the helper
        run: |
          tar -tzf dist/guac_bridge-*.tar.gz | grep 'assets/guac-bridge-agent-linux-x86_64'
          tar -tzf dist/guac_bridge-*.tar.gz | grep 'assets/guac-bridge-agent-windows-x86_64.exe'
      - uses: actions/upload-artifact@v7
        with: {name: linux-distributions, path: dist/, if-no-files-found: error}

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    needs: [test-linux, windows, cargo-windows, linux-distribution, bundled-installer]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/guac-bridge/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify tag and manifest versions
        env: {RELEASE_TAG: "${{ github.ref_name }}"}
        run: cargo xtask verify-release --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@v8
        with: {pattern: "*-distributions", path: artifacts, merge-multiple: true}
      - name: Collect Python distributions
        run: |
          mkdir -p dist
          cp artifacts/*.whl dist/
          cp artifacts/guac_bridge-*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v'))
    needs: [test-linux, windows, cargo-windows, linux-distribution, bundled-installer]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with: {pattern: "*-distributions", path: dist, merge-multiple: true}
      - name: Build checksums and release notes
        env: {RELEASE_TAG: "${{ github.ref_name }}"}
        run: cargo xtask release-notes
      - name: Publish release artifacts
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$RELEASE_TAG" dist/* --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md
