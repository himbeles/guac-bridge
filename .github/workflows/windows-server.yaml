name: Windows server helper
on:
  pull_request:
    paths-ignore: ["site/**", "tests/site/**", ".github/workflows/pages.yaml"]
  push:
    branches: [main]
    paths-ignore: ["site/**", "tests/site/**", ".github/workflows/pages.yaml"]
    tags: ["v*"]
  workflow_dispatch:
concurrency:
  group: windows-server-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-unknown-linux-musl}
      - run: cargo xtask helper linux
      - uses: actions/upload-artifact@v7
        with: {name: windows-test-linux-agent, path: target/x86_64-unknown-linux-musl/release/guac-bridge-agent}
  console:
    needs: linux-agent
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: Swatinem/rust-cache@v2
        with: {cache-on-failure: true}
      - uses: actions/download-artifact@v8
        with: {name: windows-test-linux-agent, path: linux-agent}
      - run: |
          New-Item -ItemType Directory -Force crates/guac-bridge/assets
          Copy-Item linux-agent/guac-bridge-agent crates/guac-bridge/assets/guac-bridge-agent-linux-x86_64
          cargo xtask helper windows
          cargo xtask build --prepared
      - run: cargo test --locked --workspace
      - run: python -m pip install aiohttp
      - name: Install shared UI runtime for Windows tests
        if: matrix.os != 'windows-2022'
        run: ./scripts/install-ui-runtime.ps1
      - run: python tests/windows/probe.py
      - run: python -m unittest discover -s tests/windows -p 'test_*.py' -v
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: "manager-preview-${{ runner.os }}-${{ matrix.os || 'publish' }}", path: manager-preview.png, if-no-files-found: ignore}
      - name: Bootstrap from cmd default shell
        env: {GUAC_TEST_SHELL: cmd.exe}
        run: python -m unittest discover -s tests/windows -p test_bootstrap.py -v
