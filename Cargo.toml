[workspace]
members = ["crates/guac-bridge", "xtask"]
default-members = ["crates/guac-bridge"]
resolver = "2"

[workspace.package]
version = "5.0.0-beta.3"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/himbeles/guac-bridge"

[profile.release]
lto = false
codegen-units = 1
strip = true
