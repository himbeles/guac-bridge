[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "guac-bridge"
dynamic = ["version"]
description = "TCP forwarding with SSH, LLM and RDP presets through Guacamole and FortiGate, powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "crates/guac-bridge/assets/THIRD-PARTY-NOTICES.txt"]
authors = [{name = "Luis Riegger"}]

[project.urls]
Homepage = "https://himbeles.github.io/guac-bridge/"
Documentation = "https://github.com/himbeles/guac-bridge#usage"
License = "https://github.com/himbeles/guac-bridge/blob/main/LICENSE"
Repository = "https://github.com/himbeles/guac-bridge"
Issues = "https://github.com/himbeles/guac-bridge/issues"

[tool.maturin]
manifest-path = "crates/guac-bridge/Cargo.toml"
bindings = "bin"
python-source = "python"
module-name = "guac_bridge"
python-packages = ["guac_bridge"]
targets = [{name="guac-bridge",kind="bin"}]
include = [{path="crates/guac-bridge/assets/*",format="sdist"}, {path=".cargo/config.toml",format="sdist"}]
