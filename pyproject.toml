[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "guac-bridge"
version = "1.0.1"
description = "SSH and OpenAI-compatible endpoints through Guacamole, powered by Rust"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/himbeles/guac-bridge"
Issues = "https://github.com/himbeles/guac-bridge/issues"

[tool.maturin]
manifest-path = "crates/guac-bridge/Cargo.toml"
bindings = "bin"
python-source = "python"
module-name = "guac_bridge"
python-packages = ["guac_bridge"]
targets = [{name="guac-bridge",kind="bin"}, {name="guac-ssh-client",kind="bin"}, {name="guac-llm-client",kind="bin"}]
include = [{path="crates/guac-bridge/assets/*",format="sdist"}, {path=".cargo/config.toml",format="sdist"}]
