[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "guac-bridge"
version = "0.9.0"
description = "Bridge OpenAI-compatible endpoints and SSH through Apache Guacamole"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.10,<4", "keyring>=25"]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/himbeles/guac-bridge"
Issues = "https://github.com/himbeles/guac-bridge/issues"

[project.scripts]
guac-llm-client = "guac_bridge.client:cli"
guac-llm-server = "guac_bridge.server:cli"
guac-ssh-client = "guac_bridge.ssh_client:cli"
guac-ssh-server = "guac_bridge.ssh_server:cli"

[tool.setuptools.packages.find]
where = ["src"]

