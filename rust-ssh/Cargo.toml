[package]
name = "guac-ssh-rust-prototype"
version = "0.9.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "guac-ssh-client-rs"
path = "src/client.rs"

[[bin]]
name = "guac-ssh-server-rs"
path = "src/server.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
serde_json = "1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
url = "2"

[profile.release]
lto = false
codegen-units = 1
strip = true
